name: Automated Code Cleanup Bot

on:
  schedule:
    # Runs weekly on Sunday at midnight UTC to prevent daily spam
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      auto_commit:
        description: 'Directly commit changes to current branch instead of creating a PR'
        required: false
        type: boolean
        default: false

concurrency:
  group: cleanup-bot
  cancel-in-progress: true

jobs:
  cleanup:
    name: Code Formatting & Cleanup
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install code formatting tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort ruff

      - name: Format Python codebase (source and tests only)
        run: |
          echo "Running Black on project source directories..."
          black CubeSat-Telemetry-Decoder Doppler-Auto-Tracker SDR-Hardware-Benchmark SatSDR-Universal hardware-setup

          echo "Running isort on project source directories..."
          isort CubeSat-Telemetry-Decoder Doppler-Auto-Tracker SDR-Hardware-Benchmark SatSDR-Universal hardware-setup

          echo "Running ruff autofix for safe lint improvements..."
          ruff check --fix --select I,F401,W291,W292,W293 CubeSat-Telemetry-Decoder Doppler-Auto-Tracker SDR-Hardware-Benchmark SatSDR-Universal hardware-setup || true

      - name: Check for modifications
        id: git_status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Modified files detected:"
            git status -s
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No formatting changes needed — repository is 100% clean!"
          fi

      - name: Direct commit (if requested via dispatch)
        if: steps.git_status.outputs.has_changes == 'true' && github.event.inputs.auto_commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CubeSat-Telemetry-Decoder Doppler-Auto-Tracker SDR-Hardware-Benchmark SatSDR-Universal hardware-setup
          git commit -m "chore(bot): automated code formatting and style cleanup"
          git push

      - name: Create Pull Request with fixes
        id: cpr
        if: steps.git_status.outputs.has_changes == 'true' && github.event.inputs.auto_commit != 'true'
        uses: peter-evans/create-pull-request@v7
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(bot): automated code formatting and style cleanup"
          title: "Automated Code Cleanup & Formatting"
          body: |
            ## Automated Code Cleanup
            This Pull Request was generated by the **Automated Code Cleanup Bot**.

            ### Changes applied:
            - **Black**: PEP 8 automated code formatting.
            - **isort**: Normalized and grouped import statements.
            - **Ruff**: Cleaned up unused imports and trailing whitespace.

            Target directories:
            - `CubeSat-Telemetry-Decoder/`
            - `Doppler-Auto-Tracker/`
            - `SDR-Hardware-Benchmark/`
            - `SatSDR-Universal/`
            - `hardware-setup/`

            *Review and merge when convenient!*
          branch: "bot/auto-cleanup"
          delete-branch: true
          labels: "cleanup, automated-pr"

      - name: Pull Request Status Summary
        if: steps.git_status.outputs.has_changes == 'true' && github.event.inputs.auto_commit != 'true'
        run: |
          if [ "${{ steps.cpr.outcome }}" = "success" ]; then
            echo "Pull Request successfully created at: ${{ steps.cpr.outputs.pull-request-url }}"
          else
            echo "::notice title=PR Created on Branch::Branch 'bot/auto-cleanup' was pushed! You can open a PR at: https://github.com/${{ github.repository }}/pull/new/bot/auto-cleanup"
            echo "Tip: To allow GitHub Actions to create PRs automatically without manual approval, go to Settings -> Actions -> General -> Workflow permissions and check 'Allow GitHub Actions to create and approve pull requests'."
          fi
