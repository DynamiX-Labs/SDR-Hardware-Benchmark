name: Continuous Delivery (CD)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release for current commit'
        required: false
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: Build & Validate Python Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions with Twine
        run: twine check --strict dist/*

      - name: Verify wheel installation in clean environment
        run: |
          python -m venv test-env
          source test-env/bin/activate
          pip install dist/*.whl
          python -c "import sys; print(f'Successfully validated package installation on Python {sys.version.split()[0]}')"

      - name: Archive package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          retention-days: 14

  build-docker:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: dynamix-satsdr:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image execution
        run: |
          docker run --rm dynamix-satsdr:latest python3 -c "print('Docker container execution verified!')"

  publish-release:
    name: Publish Release & Assets
    needs: [build-package, build-docker]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
