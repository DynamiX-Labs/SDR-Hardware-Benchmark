[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamix-satsdr"
version = "0.1.0"
description = "DynamiX Labs SatSDR Project Suite"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pyrtlsdr>=0.2.9",
    "paho-mqtt>=1.6.0",
    "sgp4>=2.21",
    "construct>=2.10.68",
    "galois>=0.3.8",
    "rich>=13.0.0",
    "jinja2>=3.1.2",
    "pyyaml>=6.0",
    "click>=8.1",
    "pytest>=7.4",
]

[project.optional-dependencies]
universal = [
    "matplotlib>=3.7",
    "pyaudio>=0.2.13",
    "Pillow>=9.0",
    "skyfield>=1.46",
    "sgp4>=2.23",
    "colorlog>=6.7",
    "pytest-cov>=4.1",
    "websockets>=12.0",
    "msgpack>=1.0",
    "pyzmq>=25.0",
]
benchmark = [
    "psutil>=5.9",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "tabulate>=0.9",
]
tracker = [
    "sgp4>=2.21",
    "requests>=2.31",
    "pyserial>=3.5",
]
decoder = [
    "flask>=3.0",
    "flask-socketio>=5.3",
    "sgp4>=2.23",
    "skyfield>=1.46",
    "paho-mqtt>=1.6.1",
    "scikit-learn>=1.3",
    "ntplib>=0.4.0",
    "cryptography>=41.0.0",
    "psutil>=5.9",
]
all = [
    "dynamix-satsdr[universal,benchmark,tracker,decoder]"
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "SatSDR-Universal*",
    "CubeSat-Telemetry-Decoder*",
    "Doppler-Auto-Tracker*",
    "SDR-Hardware-Benchmark*"
]
